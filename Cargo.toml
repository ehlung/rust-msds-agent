[workspace]
resolver = "2"
members = [
    "crates/pekko-agent-core",
    "crates/pekko-agent-llm",
    "crates/pekko-agent-tools",
    "crates/pekko-agent-memory",
    "crates/pekko-agent-orchestrator",
    "crates/pekko-agent-events",
    "crates/pekko-agent-security",
    "crates/pekko-agent-cache",
    "crates/pekko-agent-webhooks",
    "services/api-gateway",
    "services/ehs-permit-agent",
    "services/ehs-inspection-agent",
    "services/ehs-compliance-agent",
    "crates/pekko-agent-observability",
    "crates/pekko-agent-msds",
    "crates/pekko-agent-msds-io",
    "services/msds-ingest",
    "services/msds-orchestrator",
    "services/msds-composition-agent",
]
exclude = [
    "frontend/web-chat",
    "vendor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["pekko-agent team"]
license = "MIT"

[workspace.dependencies]
# rust-pekko base crates (path dependencies)
pekko-actor     = { path = "vendor/rust-pekko/pekko-actor" }
pekko-persistence = { path = "vendor/rust-pekko/pekko-persistence" }
pekko-event-bus = { path = "vendor/rust-pekko/pekko-event-bus" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }

# gRPC
tonic = "0.12"
prost = "0.13"


# PostgreSQL (EHS 시스템 데이터 조회용)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Kafka — MSDS 서비스 간 메시지. pekko-event-bus·events crate는 한 프로세스 안에서만 동작한다.
rdkafka = { version = "0.39" }

# PDF (msds-ingest) — 실행 시 pdfium 바이너리(PDFIUM_LIB_DIR)를 불러온다
pdfium-render = "0.9.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# Redis (response cache)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "aio"] }

# Auth & Security
jsonwebtoken = "9"
rustls = "0.23"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry       = { version = "0.24", features = ["trace"] }
opentelemetry_sdk   = { version = "0.24", features = ["trace", "rt-tokio"] }
opentelemetry-otlp  = { version = "0.17", features = ["trace", "tonic"] }
tracing-opentelemetry = "0.25"
prometheus = "0.13"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
pgvector = { version = "0.4", features = ["sqlx"] }
