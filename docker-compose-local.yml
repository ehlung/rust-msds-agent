# ============================================================================
# pekko-agent Local Development — infrastructure services only
# ============================================================================
# 로컬 개발 시 외부 인프라 서비스만 실행합니다.
# Rust 서비스(api-gateway, EHS agents)는 cargo run으로 직접 실행하세요.
#
# 사용법:
#   docker compose -f docker-compose-local.yml up -d
#   cargo run --bin api-gateway
#
# PostgreSQL 접속:
#   psql postgres://pekko:pekko_secret@localhost:5432/pekko_agent
#
# Kafka 접속 (호스트): localhost:9092
# ============================================================================

services:
  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER:     pekko
      POSTGRES_PASSWORD: pekko_secret
      POSTGRES_DB:       pekko_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-local:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pekko -d pekko_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Kafka (KRaft 단일 노드) — MSDS 서비스 간 메시지 ─────────────────────────
  # 호스트에서 cargo run으로 띄운 서비스는 localhost:9092,
  # 같은 compose 네트워크의 컨테이너는 kafka:29092로 접속한다.
  # 토픽은 서비스가 시작할 때 만든다(자동 생성은 끔).
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-local:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres-local:
  kafka-local:

networks:
  default:
    name: pekko-agent-local
