name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Unit Tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (required by pekko-persistence build.rs)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry & build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests (library crates — no DB required)
        run: |
          cargo test \
            -p pekko-agent-events \
            -p pekko-agent-orchestrator \
            -p pekko-agent-security \
            -p pekko-agent-memory \
            -p pekko-agent-tools \
            -p pekko-agent-llm \
            -p pekko-agent-msds \
            -p pekko-agent-msds-io \
            -p pekko-agent-msds-format \
            -p msds-ingest \
            -p msds-orchestrator \
            -p msds-composition-agent \
            -p msds-translate-agent \
            -p msds-handling-agent \
            -- --test-threads=4

      # 화면이 쓰는 TypeScript 타입은 Rust 타입에서 만든다. Rust 타입을 바꾸고 다시 만들지 않았으면 실패한다
      - name: Generated TypeScript types are up to date
        run: |
          bash scripts/gen-ts.sh
          changed=$(git status --porcelain frontend/msds-web/src/types/generated)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::scripts/gen-ts.sh를 다시 돌려 생성된 타입을 커밋해야 함"
            exit 1
          fi

  # ── Frontend (frontend/msds-web) ──────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/msds-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/msds-web/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── Workspace Compile Check ───────────────────────────────────────────────
  check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install protoc (required by api-gateway gRPC build.rs)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-check-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (entire workspace)
        run: cargo check --workspace

      # 공개 페이지(Workers)가 같은 변환기를 wasm32로 쓴다. 변환기에 I/O·tokio 같은 의존이 들어오면 여기서 깨진다
      - name: Format converter builds for wasm32
        run: cargo build --target wasm32-unknown-unknown -p pekko-agent-msds-format

  # ── Clippy Lint ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protoc (required by api-gateway gRPC build.rs)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy (library crates)
        run: |
          cargo clippy \
            -p pekko-agent-core \
            -p pekko-agent-events \
            -p pekko-agent-orchestrator \
            -p pekko-agent-security \
            -p pekko-agent-memory \
            -p pekko-agent-tools \
            -p pekko-agent-msds \
            -p pekko-agent-msds-io \
            -p pekko-agent-msds-format \
            -- -W clippy::all

      - name: Run clippy (service binaries)
        run: |
          cargo clippy \
            -p api-gateway \
            -p ehs-permit-agent \
            -p ehs-inspection-agent \
            -p ehs-compliance-agent \
            -p msds-ingest \
            -p msds-orchestrator \
            -p msds-composition-agent \
            -p msds-translate-agent \
            -p msds-handling-agent \
            -- -W clippy::all -A clippy::too_many_arguments

  # ── Integration Tests ─────────────────────────────────────────────────────
  integration:
    name: Integration Tests (api-gateway)
    runs-on: ubuntu-latest
    needs: [check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     pekko
          POSTGRES_PASSWORD: pekko_secret
          POSTGRES_DB:       pekko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://pekko:pekko_secret@localhost:5432/pekko_test
      DISABLE_VECTOR_STORE: "true"
      DISABLE_ORCHESTRATOR_PERSISTENCE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run integration tests
        run: |
          cargo test -p api-gateway \
            -- --test-threads=1 --nocapture
