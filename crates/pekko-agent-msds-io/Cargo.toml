[package]
name = "pekko-agent-msds-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MSDS 서비스의 Kafka 연결, 파일 저장소, Claude 호출, 작업 상태 저장소"

[dependencies]
pekko-agent-msds = { path = "../pekko-agent-msds" }
rdkafka = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
pekko-agent-llm = { path = "../pekko-agent-llm" }
sha2 = "0.10"
sqlx = { workspace = true }
pekko-actor = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
ts-rs = { version = "10", optional = true, features = ["uuid-impl", "chrono-impl", "no-serde-warnings"] }

[features]
# 화면(frontend/msds-web)용 TypeScript 타입 생성. scripts/gen-ts.sh가 켠다
ts = ["dep:ts-rs", "pekko-agent-msds/ts"]
