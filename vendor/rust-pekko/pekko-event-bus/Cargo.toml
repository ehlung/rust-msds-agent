[package]
name = "pekko-event-bus"
version = "0.1.0"
edition = "2021"
authors = ["Pekko Rust Contributors"]
description = "Pekko Internal Event Bus - Kafka-like event streaming without external dependencies"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
