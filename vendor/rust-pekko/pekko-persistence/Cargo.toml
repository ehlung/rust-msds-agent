[package]
name = "pekko-persistence"
version = "0.1.0"
edition = "2021"
authors = ["Pekko Rust Contributors"]
description = "Event sourcing and persistence for Pekko actors"
license = "Apache-2.0"

[dependencies]
pekko-actor = { path = "../pekko-actor" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
prost-types = "0.12"

# Database drivers
scylla = { version = "0.12", features = ["ssl"], optional = true }
cassandra-cpp = { version = "3.0", optional = true }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"], optional = true }
coredb = { path = "../../coredb", optional = true }
base64 = { version = "0.22", optional = true }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.0"
parking_lot = "0.12"

# Configuration
config = "0.14"
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
testcontainers = "0.15"
criterion = "0.5"

[build-dependencies]
prost-build = "0.12"

[features]
default = ["scylla-driver"]
scylla-driver = ["scylla"]
cassandra-cpp-driver = ["cassandra-cpp"]
postgres = ["sqlx"]
coredb-backend = ["coredb", "base64"]
