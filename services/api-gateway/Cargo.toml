[package]
name = "api-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
pekko-agent-core = { path = "../../crates/pekko-agent-core" }
pekko-agent-llm = { path = "../../crates/pekko-agent-llm" }
pekko-agent-tools = { path = "../../crates/pekko-agent-tools" }
pekko-agent-memory = { path = "../../crates/pekko-agent-memory" }
pekko-agent-orchestrator = { path = "../../crates/pekko-agent-orchestrator" }
pekko-agent-events = { path = "../../crates/pekko-agent-events" }
pekko-agent-security = { path = "../../crates/pekko-agent-security", features = ["postgres"] }
pekko-agent-observability = { path = "../../crates/pekko-agent-observability" }
pekko-agent-cache    = { path = "../../crates/pekko-agent-cache" }
pekko-agent-webhooks = { path = "../../crates/pekko-agent-webhooks" }
pekko-agent-msds    = { path = "../../crates/pekko-agent-msds" }
pekko-agent-msds-io = { path = "../../crates/pekko-agent-msds-io" }
pekko-agent-msds-format = { path = "../../crates/pekko-agent-msds-format" }
# macOS 브라우저는 한글 파일 이름을 자모로 풀어(NFD) 보낸다. 완성형(NFC)으로 맞춰 저장한다
unicode-normalization = "0.1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, features = ["multipart"] }
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
pekko-actor.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
futures.workspace = true
tonic.workspace = true
prost.workspace = true
tokio-stream = "0.1"
sha2 = "0.10"
utoipa = { version = "4", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

[build-dependencies]
tonic-build = "0.12"
